# Number windows and panes from 1 and remove numbering gaps.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on
set -ga terminal-overrides ",*256col*:Tc"
set-option -g default-shell "/bin/zsh"
set-option -g default-command "exec /bin/zsh -il"
set -g @resurrect-strategy-vim 'session'
set -g mouse on
set -g mode-keys vi
set -g default-terminal "tmux-256color"
set -g history-limit 50000
set -ga update-environment " WSL_INTEROP VSCODE_IPC_HOOK_CLI"

# Open new windows and panes in the current pane's directory.
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Keep the client attached when its active session is destroyed.
set -g detach-on-destroy off
set -g display-panes-time 1500

# statusbar'i goster/gizle
bind-key -n C-f3 set-option -g status

# yeni dikey pane 77'ini alsin.
bind-key x command-prompt -p "split-window:" "split-window '%%' -p 76"

# Son pencereler arasinda gezinme
bind ^B last-window

# ekrani temizleme
bind -n C-o send-keys -R Enter \; clear-history \;

# Resize with prefix followed by an uppercase Vim direction.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reorder panes without changing their processes.
bind -r < swap-pane -U
bind -r > swap-pane -D

# Limit the fzf menu to everyday management functions.
TMUX_FZF_ORDER="session|window|pane|command|keybinding"
TMUX_FZF_OPTIONS="-p -w 70% -h 70% -m"

# plugin manager kurulum
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set-option -g @plugin 'b0o/tmux-autoreload'
set -g @plugin 'tmux-plugins/tmux-sessionist'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Save every 15 minutes. Start with automatic restore disabled.
set -g @continuum-save-interval '15'

# Seamless Ctrl-h/j/k/l navigation across Vim splits and tmux panes.
# Use the copy installed by vim-plug so no second plugin install is needed.
run-shell '~/.vim/plugged/vim-tmux-navigator/vim-tmux-navigator.tmux'

# WSL2: copy directly to the Windows clipboard. Avoid Wayland primary
# selection and terminal OSC 52 handling, both of which can leave copy mode
# appearing frozen in Windows Terminal.
set -g set-clipboard external
bind-key -T copy-mode-vi y \
  send-keys -X copy-pipe-and-cancel 'clip.exe'
bind-key -T copy-mode-vi Enter \
  send-keys -X copy-pipe-and-cancel 'clip.exe'
bind-key -T copy-mode-vi MouseDragEnd1Pane \
  send-keys -X copy-pipe-and-cancel 'clip.exe'
bind-key -T copy-mode-vi DoubleClick1Pane \
  select-pane \; send-keys -X select-word \; \
  send-keys -X copy-pipe-and-cancel 'clip.exe'
bind-key -T copy-mode-vi TripleClick1Pane \
  select-pane \; send-keys -X select-line \; \
  send-keys -X copy-pipe-and-cancel 'clip.exe'

# Mouse selection enters copy mode, which pauses pane updates on screen.
# Make Escape leave copy mode instead of only clearing the selection.
bind-key -T copy-mode-vi Escape send-keys -X cancel

# S is owned by tmux-sessionist (switch to last session, loaded via tpm below).
bind y setw synchronize-panes
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

set -g status-left-length 100
set -g status-left '#S '
set -g status-right ''

