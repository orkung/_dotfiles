# statusbar'i goster/gizle
bind-key -n C-f3 set-option -g status

# yeni dikey pane 77'ini alsin.
bind-key x command-prompt -p "split-window:" "split-window '%%' -p 76"

# Son pencereler arasinda gezinme
bind ^B last-window
#
# aktif pane kenarlik rengi
#set -g pane-active-border-fg colour16
##set -g pane-border-fg colour16
set -g focus-events on

#unbind C-Down
#bind -n C-Down resize-pane -D 10
#unbind C-Up
#bind -n C-Up resize-pane -U 10
unbind C-Left
#bind -n C-Left resize-pane -L 10
unbind C-Right
#bind -n C-Right resize-pane -R 10

# Seamless Ctrl-h/j/k/l navigation across Vim splits and tmux panes.
# Use the copy installed by vim-plug so no second plugin install is needed.
run-shell '~/.vim/plugged/vim-tmux-navigator/vim-tmux-navigator.tmux'
#
#set -g history-file ~/.tmux_history
#
#set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"
#set -g default-terminal "xterm-256color"
#set -g default-terminal "xterm"
#set -g default-terminal "screen-256color-bce"
#set -g default-terminal "tmux-256color"

set -ga terminal-overrides ",*256col*:Tc"
set-option -g default-shell "/bin/zsh"
set-option -g default-command "exec /bin/zsh -il"

# plugin manager kurulum
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set-option -g @plugin 'b0o/tmux-autoreload'
set -g @plugin 'tmux-plugins/tmux-sessionist'
#set -g @plugin 'thepante/tmux-git-autofetch'
#set -g @plugin 'tmux-plugins/tmux-continuum'
#set -g @plugin 'tmux-plugins/tmux-resurrect'
#set -g @plugin 'spywhere/tmux-named-snapshot'
#set -g @plugin 'jaclu/tmux-menus'
#set -g @plugin 'tmux-plugins/tmux-sensible'
#set -g @plugin 'sainnhe/tmux-fzf'
#set -g @plugin 'tmux-plugins/tmux-copycat'
#set -g @plugin 'laktak/extrakto'
#set -g @plugin 'tmux-plugins/tmux-yank'
#set -g @plugin 'tmux-plugins/tmux-open'
#set -g @plugin 'tmux-plugins/tmux-sidebar'
#set -g @plugin 'tmux-plugins/tmux-logging'
#set -g @plugin 'tmux-plugins/tmux-sensible'
#set -g @plugin 'tmux-plugins/vim-tmux-clipboard'
#set -g @plugin 'jbnicolai/tmux-fpp'

#set-option -g default-shell "/bin/zsh"

# plugin manager kurulum
# List of plugins
# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

#set -g @yank_selection 'clipboard' # or 'secondary' or 'clipboard' or 'primary'
set -g @resurrect-strategy-vim 'session'
#set -g @resurrect-process 'keep-presence  "--seconds 60"'
#set -g @continuum-boot 'on'
# bind -n C-k clear-history
# bind -n C-k send-keys ^c clear Enter \; clear-history \;
bind -n C-o send-keys -R Enter \; clear-history \;

## update VSCODE variables from integrated terminal so that `code` command opens
## in current window
#set-option -ga update-environment ' VSCODE_GIT_ASKPASS_NODE VSCODE_GIT_ASKPASS_MAIN VSCODE_IPC_HOOK_CLI PATH GIT_ASKPASS'
set -g mouse on
bind S setw synchronize-panes
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Session switching keybindings
## Choose/switch session with Ctrl+Shift+s
#bind-key -n C-S choose-session

# Next/previous session with prefix + n/p
#bind-key n switch-client -n
##bind-key p switch-client -p

# Note: Use Ctrl+Shift+s (choose-session) to interactively select a session
#
set -g default-terminal "tmux-256color"
set -g history-limit 50000
